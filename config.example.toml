# Codex Micro for Claude Code: what each control on the pad does.
#
# Copy to ~/.config/codex-micro/config.toml and change what you like. Anything
# left out keeps the default shown here. Changes apply on the next press.
#
# The six agent keys always show and switch to their session.
#
# Actions:
#
#   "approve"        answer Yes to the permission prompt waiting on you
#   "deny"           answer No to it; with none waiting, stop the running turn
#   "interrupt"      stop the running turn
#   "submit"         send what is typed in the prompt box
#   "fast"           toggle fast mode (/fast)
#   "voice"          toggle voice mode (/voice)
#   "fork"           copy the conversation into a new terminal window
#   "effort-up"      raise or lower reasoning effort one step
#   "effort-down"
#   "cycle-mode"     cycle permission modes, as Shift+Tab does
#   "attention"      switch to the session that most needs you
#   "next-session"   switch to the next or previous session
#   "prev-session"
#   "none"           do nothing
#
#   "/command args"                      run a slash command, e.g. "/model sonnet"
#   { text = "run the tests" }           type into the prompt box
#   { text = "continue", submit = true } type and send
#   { keys = "ctrl+r" }                  press keys in the session's terminal
#   { hold = "fn" }                      hold a key down while the pad's key is
#                                        held, for dictation apps (keys only,
#                                        macOS, needs Accessibility)
#   { run = ["notify-send", "hi"] }      run a program
#   { run = "say done" }                 run a shell command
#
# Controls act on the session whose terminal has focus, or else the one a
# control last went to. Approve and deny go to the session waiting on you.

[keys]
fast = "fast"        # lightning bolt
approve = "approve"  # check
deny = "deny"        # cross
branch = "fork"      # branch
mic = "voice"        # microphone; { hold = "fn" } for Wispr Flow
send = "submit"      # Codex logo

[dial]
left = "effort-down"
right = "effort-up"
press = "/effort"
hold = "none"        # held for half a second or longer

[stick]
up = "cycle-mode"
down = "attention"
left = "prev-session"
right = "next-session"

[terminal]
# The command "fork" opens a new terminal with; the program is appended.
# Unset, a new window of the session's own terminal app on macOS, and on
# Linux xdg-terminal-exec, $TERMINAL, then common terminals.
# command = ["foot"]

[pad]
# The Bluetooth channel to keep to, from 1 to 9. Each channel of the pad is
# its own device on macOS, so another app such as ChatGPT can keep the others
# and the pad's channel button switches between them. USB is always used.
# Unset, any channel. macOS only for now.
# channel = 2
